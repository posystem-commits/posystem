# Free Cloudflare Worker: every 3 minutes it checks that the POS is reachable and answering, and tells the owner
# on Telegram if it isn't (and again when it recovers). Separate from Vercel and Supabase.
name = "pos-uptime-watch"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = true   # the public address is the Telegram webhook; every route besides the webhook needs a derived password
preview_urls = false   # no extra public addresses

[triggers]
crons = ["*/3 * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "0266f6a84c2c4ec78820e2f6e3c14e19"

# Secrets (set with `wrangler secret put`): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS (comma separated), HEALTHCHECK_URL (optional)
# Variables:
[vars]
SITE = "https://posystem-steel.vercel.app"
PROBE_TENANT = "1e9da9de-1e02-4376-a6cf-4433a62bedf1"   # the test restaurant: probes never touch a real one
KAIVO_PAGE = "/t/089591ae-3a36-4432-8b78-cf2f3ad4cb87"   # read-only page load, same as a customer opening it
WORKER_URL = "https://pos-uptime-watch.posystem15-cac.workers.dev"
GITHUB_REPO = "posystem-commits/posystem"
# Extra secret for the Telegram doorway (set with `wrangler secret put GH_DISPATCH_TOKEN`): a GitHub token that may only start this repository's workflows.
